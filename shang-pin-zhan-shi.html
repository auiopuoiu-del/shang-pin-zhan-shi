<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>商品展示</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }

      :root {
        --bg: #f6f5f1;
        --surface: #ffffff;
        --ink: #1c1a17;
        --ink-2: #57534b;
        --ink-3: #8a857a;
        --line: #e5e1d8;
        --accent: #c8102e;
        --accent-ink: #a50d27;
        --ok: #1d7a3a;
        --ok-bg: #e5f3e9;
        --warn: #9a6200;
        --warn-bg: #fdf0d5;
        --out: #6d675e;
        --out-bg: #eceae4;
        --img-bg: #fbfaf7;
        --shadow: 0 1px 2px rgba(28,26,23,.05), 0 10px 28px -14px rgba(28,26,23,.22);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --surface: #1f1d1a;
          --ink: #f0ede6;
          --ink-2: #b8b2a6;
          --ink-3: #8a857a;
          --line: #35322c;
          --accent: #f0566e;
          --accent-ink: #ff8296;
          --ok: #5fce85;
          --ok-bg: #173324;
          --warn: #f0b84e;
          --warn-bg: #3a2c10;
          --out: #a39c8e;
          --out-bg: #2c2a26;
          --img-bg: #26241f;
          --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
        line-height: 1.55;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

      /* ---------- 页首汇总 ---------- */
      .summary { padding: 28px 0 6px; }
      .summary h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 5.4vw, 38px);
        font-weight: 800;
        letter-spacing: .01em;
      }
      .summary p { margin: 0; color: var(--ink-2); font-size: 15px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 20px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat .num {
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .stat .num em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
      .stat .label { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

      /* ---------- 分类筛选 ---------- */
      .filters {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        padding: 16px 0 12px;
        margin-top: 10px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-2);
        border-radius: 999px;
        padding: 8px 16px;
        min-height: 40px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--bg);
      }
      .chip .cnt { font-variant-numeric: tabular-nums; opacity: .65; font-weight: 500; margin-left: 4px; }

      /* ---------- 商品网格 ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 6px;
      }
      @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
      @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
        width: 100%;
      }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .card .photo {
        background: var(--img-bg);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .card .photo img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      .card.is-out .photo img { filter: grayscale(.55); opacity: .75; }
      .badge {
        position: absolute;
        top: 10px; left: 10px;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        line-height: 1.4;
      }
      .badge.ok { background: var(--ok-bg); color: var(--ok); }
      .badge.warn { background: var(--warn-bg); color: var(--warn); }
      .badge.out { background: var(--out-bg); color: var(--out); }
      .card .body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
      .card h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.35; }
      .card .spec { color: var(--ink-3); font-size: 13px; }
      .card .intro {
        margin: 0;
        color: var(--ink-2);
        font-size: 13.5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .stock {
        margin-top: auto;
        padding-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .card .stock .n {
        font-size: 26px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .card .stock .u { color: var(--ink-2); font-size: 13px; }
      .card .stock .t { color: var(--ink-3); font-size: 13px; margin-left: auto; }

      .empty {
        display: none;
        text-align: center;
        color: var(--ink-3);
        padding: 48px 0;
        font-size: 15px;
      }

      footer {
        margin-top: 36px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--ink-3);
        font-size: 13px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
      }

      /* ---------- 详情弹窗 ---------- */
      .overlay {
        position: fixed; inset: 0;
        background: rgba(20, 18, 15, .55);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 50;
      }
      .overlay.open { display: flex; }
      .sheet {
        background: var(--surface);
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        overflow-y: auto;
        border-radius: 20px 20px 0 0;
        padding: 0 0 28px;
      }
      @media (min-width: 640px) {
        .overlay { align-items: center; padding: 24px; }
        .sheet { border-radius: 20px; }
      }
      .sheet .photo {
        background: var(--img-bg);
        aspect-ratio: 16 / 10;
        overflow: hidden;
      }
      .sheet .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .sheet .inner { padding: 20px 22px 0; }
      .sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
      .sheet .spec { color: var(--ink-3); font-size: 14px; }
      .sheet .intro { color: var(--ink-2); font-size: 15px; margin: 12px 0 0; }
      .sheet .stockrow {
        display: flex; align-items: baseline; gap: 8px;
        margin-top: 18px; padding: 14px 16px;
        border: 1px solid var(--line); border-radius: 12px;
      }
      .sheet .stockrow .n { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
      .sheet .stockrow .u { color: var(--ink-2); font-size: 14px; }
      .sheet .stockrow .badge { position: static; margin-left: auto; }
      dl.details { margin: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; font-size: 14.5px; }
      dl.details dt { color: var(--ink-3); }
      dl.details dd { margin: 0; color: var(--ink); }
      .closebtn {
        margin: 22px 22px 0;
        width: calc(100% - 44px);
        min-height: 48px;
        border: none;
        border-radius: 12px;
        background: var(--ink);
        color: var(--bg);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="summary">
        <h1>在售商品一览</h1>
        <p>以下为当前在售饮料及库存数量，点开任意商品可查看详细介绍。</p>
        <div class="stats">
          <div class="stat"><div class="num" id="statKinds">–</div><div class="label">商品种类</div></div>
          <div class="stat"><div class="num" id="statTotal">–</div><div class="label">库存总量</div></div>
          <div class="stat"><div class="num" id="statCats">–</div><div class="label">商品分类</div></div>
        </div>
      </section>

      <nav class="filters" aria-label="按分类筛选">
        <div class="chips" id="chips"></div>
      </nav>

      <main>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty">该分类下暂时没有商品。</p>
      </main>

      <footer>
        <span>库存数据更新于 2026 年 11 月 10 日</span>
        <span>数量如有变动，以最新页面为准</span>
      </footer>
    </div>

      var LOW_STOCK = 20;

      function stockState(p) {
        if (p.stock <= 0) return { key: "out", label: "暂时缺货" };
        if (p.stock <= LOW_STOCK) return { key: "warn", label: "库存偏少" };
        return { key: "ok", label: "库存充足" };
      }

      var grid = document.getElementById("grid");
      var empty = document.getElementById("empty");
      var chipsBox = document.getElementById("chips");

      // 汇总
      var total = PRODUCTS.reduce(function (s, p) { return s + p.stock; }, 0);
      document.getElementById("statKinds").innerHTML = PRODUCTS.length + "<em>种</em>";
      document.getElementById("statTotal").innerHTML = total + "<em>件</em>";
      var cats = [];
      PRODUCTS.forEach(function (p) { if (cats.indexOf(p.cat) === -1) cats.push(p.cat); });
      document.getElementById("statCats").innerHTML = cats.length + "<em>类</em>";

      // 分类按钮
      var filterNames = ["全部"].concat(cats);
      filterNames.forEach(function (name, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
        var count = name === "全部" ? PRODUCTS.length : PRODUCTS.filter(function (p) { return p.cat === name; }).length;
        b.innerHTML = name + '<span class="cnt">' + count + "</span>";
        b.addEventListener("click", function () {
          chipsBox.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          render(name);
        });
        chipsBox.appendChild(b);
      });

      function render(cat) {
        grid.innerHTML = "";
        var shown = 0;
        PRODUCTS.forEach(function (p, idx) {
          if (cat !== "全部" && p.cat !== cat) return;
          shown++;
          var st = stockState(p);
          var card = document.createElement("button");
          card.type = "button";
          card.className = "card" + (st.key === "out" ? " is-out" : "");
          card.setAttribute("aria-label", p.name + "，" + p.spec + "，库存 " + p.stock + " " + p.unit);
          card.innerHTML =
            '<span class="photo"><img src="' + p.img + '" alt="' + p.alt + '" loading="lazy" />' +
            '<span class="badge ' + st.key + '">' + st.label + "</span></span>" +
            '<span class="body">' +
            "<h2>" + p.name + "</h2>" +
            '<span class="spec">' + p.spec + "</span>" +
            '<p class="intro">' + p.intro + "</p>" +
            '<span class="stock"><span class="n">' + p.stock + '</span><span class="u">' + p.unit + '</span><span class="t">当前库存</span></span>' +
            "</span>";
          card.addEventListener("click", function () { openSheet(idx); });
          grid.appendChild(card);
        });
        empty.style.display = shown === 0 ? "block" : "none";
      }
      render("全部");

      // 详情弹窗
      var overlay = document.getElementById("overlay");
      function openSheet(idx) {
        var p = PRODUCTS[idx];
        var st = stockState(p);
        document.getElementById("sheetImg").src = p.img;
        document.getElementById("sheetImg").alt = p.alt;
        document.getElementById("sheetName").textContent = p.name;
        document.getElementById("sheetSpec").textContent = p.spec + " · " + p.cat;
        document.getElementById("sheetIntro").textContent = p.intro;
        document.getElementById("sheetStock").textContent = p.stock;
        document.getElementById("sheetUnit").textContent = p.unit + "（当前库存）";
        var badge = document.getElementById("sheetBadge");
        badge.className = "badge " + st.key;
        badge.textContent = st.label;
        document.getElementById("sheetDetails").innerHTML = p.details.map(function (d) {
          return "<dt>" + d[0] + "</dt><dd>" + d[1] + "</dd>";
        }).join("");
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeSheet() {
        overlay.classList.remove("open");
        document.body.style.overflow = "";
      }
      document.getElementById("closeBtn").addEventListener("click", closeSheet);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
    </script>
  </body>
</html>
